[package]
name = "rift-recap"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Self-hosted Discord bot that posts a scoreboard after every League of Legends game your squad plays, plus daily, weekly and monthly LP recaps"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "raster-images"] }
png = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12", default-features = false, features = ["builder", "client", "gateway", "http", "model", "rustls_backend"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
webp = { version = "0.3.1", default-features = false }

# Use the native lossy entry point without the wrapper's full-size ARGB copy.
libwebp-sys = "0.9.6"
[profile.dev]
debug = 0

# Keep image rendering fast without optimizing the entire HTTP/Discord dependency tree.
# Cargo package overrides are not transitive, so include the hot rendering dependencies.
[profile.dev.package.resvg]
opt-level = 2
[profile.dev.package.usvg]
opt-level = 2
[profile.dev.package.tiny-skia]
opt-level = 2
[profile.dev.package.tiny-skia-path]
opt-level = 2
[profile.dev.package.rustybuzz]
opt-level = 2
[profile.dev.package.ttf-parser]
opt-level = 2
[profile.dev.package.fontdb]
opt-level = 2
[profile.dev.package.png]
opt-level = 2
[profile.dev.package.flate2]
opt-level = 2
[profile.dev.package.miniz_oxide]
opt-level = 2
[profile.dev.package.fdeflate]
opt-level = 2
[profile.dev.package.libwebp-sys]
opt-level = 2

# Retain optimized native storage and cryptography in development too.
[profile.dev.package.libsqlite3-sys]
opt-level = 1
[profile.dev.package.ring]
opt-level = 2

[profile.release]
strip = true

# The Discord SDK is I/O-bound; keep optimized code without costly level-3 passes.
[profile.release.package.serenity]
opt-level = 2
