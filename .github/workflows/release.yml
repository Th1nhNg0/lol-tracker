name: Release

# Pushing a version tag (v1.2.3) builds the static musl binary, tests it, and publishes it as a
# GitHub Release with a SHA-256 checksum and a build-provenance attestation. Servers pull releases
# with deploy/rift-recap-update; nothing here talks to a server or needs a secret.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag must match the crate version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2; exit 1; }

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run tests
        run: cargo test --locked --all-targets

      # The Dockerfile's build stage compiles on Alpine, so this is the same static musl binary the
      # container image ships; it runs on any x86_64 Linux regardless of its glibc.
      - name: Build static binary
        run: |
          set -euo pipefail
          docker build --target build --tag rift-recap-build .
          id=$(docker create rift-recap-build)
          mkdir dist
          docker cp "${id}:/src/target/release/rift-recap" dist/rift-recap-linux-x86_64
          docker rm "${id}" >/dev/null
          (cd dist && sha256sum rift-recap-linux-x86_64 > SHA256SUMS && cat SHA256SUMS)

      - name: Binary must report the tag
        run: |
          set -euo pipefail
          chmod +x dist/rift-recap-linux-x86_64
          test "$(dist/rift-recap-linux-x86_64 --version)" = "rift-recap ${GITHUB_REF_NAME#v}"
          file dist/rift-recap-linux-x86_64 | grep -q 'statically linked\|static-pie'

      - name: Save release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/rift-recap-linux-x86_64

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/rift-recap-linux-x86_64 dist/SHA256SUMS \
            --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
