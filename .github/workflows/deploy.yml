name: Deploy Rift Recap

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rift-recap-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Build release binary
        run: cargo build --release --locked --bin rift-recap

      - name: Save binary for deployment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rift-recap-linux-x86_64
          path: target/release/rift-recap
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download tested binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rift-recap-linux-x86_64
          path: dist

      - name: Configure restricted SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/rift_recap"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rift_recap" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/rift_recap" >/dev/null
          grep -Fq "$DEPLOY_HOST " "$HOME/.ssh/known_hosts"

      - name: Deploy and restart the service
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/rift_recap" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "riftdeploy@${DEPLOY_HOST}" "deploy ${GITHUB_SHA}" < dist/rift-recap

      - name: Verify live service
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          state=$(ssh -i "$HOME/.ssh/rift_recap" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "riftdeploy@${DEPLOY_HOST}" status)
          printf '%s\n' "$state"
          printf '%s' "$state" | python3 -c '
          import json, os, sys
          state=json.load(sys.stdin)
          assert state["healthy"] is True, state
          assert state["commit"] == os.environ["GITHUB_SHA"], state
          assert state["binary_sha256"] == state["process_sha256"], state
          print("live process matches deployed commit and binary")
          '

  notify:
    if: always()
    needs:
      - build
      - deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Configure restricted SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/rift_recap"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rift_recap" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/rift_recap" >/dev/null

      - name: Notify Discord thread
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          GITHUB_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$BUILD_RESULT" = success ] && [ "$DEPLOY_RESULT" = success ]; then
            overall=success
          elif [ "$BUILD_RESULT" = cancelled ] || [ "$DEPLOY_RESULT" = cancelled ]; then
            overall=cancelled
          else
            overall=failure
          fi
          ssh -i "$HOME/.ssh/rift_recap" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "riftdeploy@${DEPLOY_HOST}" \
            "notify ${overall} ${BUILD_RESULT} ${DEPLOY_RESULT} ${GITHUB_SHA} ${RUN_URL}"
